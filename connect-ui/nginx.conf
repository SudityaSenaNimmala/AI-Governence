# nginx config for the connect-ui SPA in production.
# - Serves the app under /CloudFuze (Vite base path).
# - Proxies /api/* to the server container (service name "server", port 8787).

server {
    listen 80;
    server_name _;
    # Keep redirects relative so the host:port (e.g. :3000) is preserved.
    absolute_redirect off;

    # Send bare / and the no-trailing-slash base to the app's base path.
    location = / {
        return 302 /CloudFuze/;
    }
    location = /CloudFuze {
        return 302 /CloudFuze/;
    }

    # Runtime config, deliberately never cached. The whole point of this file is that it can be
    # edited on the host to flip Hotjar on or off without a rebuild — a cached copy would make
    # that edit look like it did nothing until the browser happened to revalidate.
    location = /CloudFuze/runtime-config.js {
        alias /usr/share/nginx/html/CloudFuze/runtime-config.js;
        add_header Cache-Control "no-store" always;
    }

    # THE SHELL MUST NEVER BE CACHED, and this is the one that bit us.
    #
    # index.html carries no hash in its name and names the hashed bundle inside it
    # (static/index-<hash>.js). It was served with an ETag and Last-Modified but NO
    # Cache-Control, so browsers fall back to HEURISTIC caching — they are free to
    # reuse it without revalidating. A stale shell names the OLD bundle, so the
    # browser keeps running the previous build after a deploy: routes that exist in
    # the new code 404 or fall through, new pages are unreachable, and the app looks
    # exactly as it did before the deploy. Nothing errors, the deploy reports
    # success, and curl confirms the new bundle is live — because curl does not have
    # the stale shell.
    #
    # This is the same failure runtime-config.js above was already given no-store
    # for. The shell needs it more: that file only flips Hotjar, this one decides
    # which JavaScript the whole app runs.
    location = /CloudFuze/index.html {
        alias /usr/share/nginx/html/CloudFuze/index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # The hashed build output is the opposite case: the filename changes whenever
    # the contents do, so it can be cached hard and forever. Caching these is what
    # makes a no-store shell cheap — the browser re-fetches one small HTML file per
    # visit and reuses several MB of JS.
    location /CloudFuze/static/ {
        alias /usr/share/nginx/html/CloudFuze/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    # The fallback is an internal redirect, so it re-runs location matching and
    # picks up the no-store header above rather than bypassing it.
    location /CloudFuze/ {
        alias /usr/share/nginx/html/CloudFuze/;
        try_files $uri $uri/ /CloudFuze/index.html;
    }

    # API proxy -> server container. Use Docker's embedded DNS (127.0.0.11) with a
    # variable upstream so nginx re-resolves at request time — otherwise it caches
    # the server's IP at startup and returns 502 after the server is redeployed.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_server server;
        proxy_pass http://$upstream_server:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
