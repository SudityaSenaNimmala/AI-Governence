<body>
  <!-- data-hj-suppress: Hotjar masks the text of a tagged element AND all of its descendants, so
       these three attributes suppress every string the app renders. Deliberately broad.
       This app displays customer mailboxes, tenant domains, file and channel names, collaborator
       lists and migration mappings across ~230 render sites in ~86 components -- a per-field
       allowlist would leak the moment anyone adds a table column. Governing where customer data
       goes is what this product is for, so it does not export that data to a session recorder.
       Recordings and heatmaps still capture layout, clicks, rage clicks, scroll depth and
       navigation; only the text is masked.
       All three roots need it: popup-root and toast-root are React portals that render OUTSIDE
       #root, so suppressing #root alone would still ship popup and toast text.
       To relax this, move the attribute off these roots and onto the specific PII-bearing
       containers instead -- and re-check the leaks before you do. -->
  <div id="root" data-hj-suppress></div>
  <div id="popup-root" data-hj-suppress></div>
  <div id="toast-root" style="z-index: 99999999999999999;" data-hj-suppress></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- End Google Tag Manager (noscript) -->
</body>
