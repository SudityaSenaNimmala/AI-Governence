name: Deploy to server

# Auto-deploy on every push to main (and the manual "Run workflow" button).
# The runner builds connect-ui (plenty of RAM) then runs scripts/deploy.mjs to
# ship code + rebuild on the server over SSH.
#
# Secrets stay on the SERVER: /opt/ai-gov/.env (created once) holds MONGODB_URI,
# ENCRYPTION_KEY, JWT_SECRET, ENROLL_SECRET. The deploy never ships or overwrites
# it. So GitHub only needs the SSH key + host — no database/app secrets here.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#   SSH_KEY_B64       base64 of the deploy private key (paste-proof, single line):
#                       cat ~/.ssh/ai_gov_deploy | base64 -w0 | clip
#   DEPLOY_HOST       user@host, EXACTLY: root@165.22.223.59

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install connect-ui deps
        working-directory: connect-ui
        run: npm install --no-audit --no-fund

      - name: Set up SSH key + known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Key is stored base64 (paste-proof). Decode it — base64 ignores whitespace.
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "key fingerprint:"; ssh-keygen -l -f ~/.ssh/deploy_key || echo "!! key did not parse — SSH_KEY_B64 is wrong"
          HOST="${{ secrets.DEPLOY_HOST }}"; IP="${HOST#*@}"
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Testing SSH connectivity to $HOST ..."
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$HOST" 'echo SSH_OK'

      - name: Deploy (code only — server keeps its own .env)
        env:
          DEPLOY_SSH: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: /home/runner/.ssh/deploy_key
        run: node scripts/deploy.mjs
