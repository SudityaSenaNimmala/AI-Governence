name: Deploy to server

# Auto-deploy on every push to main (and the manual "Run workflow" button).
# The runner builds connect-ui (plenty of RAM) then runs scripts/deploy.mjs to
# ship code + rebuild on the server over SSH.
#
# Secrets stay on the SERVER: /opt/ai-gov/.env (created once) holds MONGODB_URI,
# ENCRYPTION_KEY, JWT_SECRET, ENROLL_SECRET. The deploy never ships or overwrites
# it. So GitHub only needs the SSH key + host — no database/app secrets here.
# ADMIN_TOKEN is the one exception to "created once, by hand": scripts/deploy.mjs
# generates it directly in that same .env on the server if it's missing (never
# overwriting an existing value), so it needs no manual setup at all.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#   SSH_KEY_B64       base64 of ~/.ssh/ai_gov_deploy (single line, paste-proof):
#                       cat ~/.ssh/ai_gov_deploy | base64 -w0
#   (DEPLOY_HOST / SSH_PRIVATE_KEY no longer used — host is a hardcoded public IP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install connect-ui deps
        working-directory: connect-ui
        run: npm install --no-audit --no-fund

      - name: Set up SSH key + known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Key stored base64 (single line, paste-proof). base64 -d ignores whitespace.
          echo "${{ secrets.SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "key fingerprint (expect ...I1FXkSy...):"; ssh-keygen -l -f ~/.ssh/deploy_key || echo "!! key did not parse — SSH_KEY_B64 missing/wrong"
          IP="165.22.223.59"
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Testing SSH connectivity to root@$IP ..."
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "root@$IP" 'echo SSH_OK'

      - name: Deploy (code only — server keeps its own .env)
        env:
          DEPLOY_SSH: root@165.22.223.59
          DEPLOY_KEY: /home/runner/.ssh/deploy_key
        run: node scripts/deploy.mjs
