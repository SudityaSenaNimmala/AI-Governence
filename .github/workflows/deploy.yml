name: Deploy to server

# Push to main -> test -> build -> live, with no human step in between.
#
# THE ONLY WORKFLOW IN THIS REPO
#   ci.yml and advisory.yml were removed and folded in here (the `test` and
#   `frontend` jobs below are what ci.yml used to contain) so there is exactly
#   one workflow to reason about: this file. advisory.yml's lint/known-failing
#   checks were never a deploy gate, so nothing here replaces them - if you
#   want them back, run them by hand (npm run lint in connect-ui; npm test in
#   agent) rather than reintroducing a second workflow file.
#
# WHY A SELF-HOSTED RUNNER AND NOT SSH
#   The previous version of this file connected in over SSH from a GitHub-hosted
#   runner, and was deleted in cc18c68 because it could never work: sshd on the
#   deploy host is not reachable from the internet (verified — of ports
#   22/2222/2022/22022/443/8787 only 443 and 8787 answer, and both are nginx/the
#   API). A firewall that admits only known addresses also cannot admit a GitHub
#   runner, whose IPs are a large rotating range.
#   A self-hosted runner installed ON the host dials OUT to GitHub instead, so it
#   needs no inbound port, no firewall change, and no SSH key in repository
#   secrets. See docs/AUTO_DEPLOY.md for the one-time install.
#
# WHAT THE RUNNER NEEDS (one-time — docs/AUTO_DEPLOY.md has the commands)
#   - labels: self-hosted, linux, ai-gov
#   - docker + docker compose usable by the runner's user
#   - write access to DEPLOY_DIR (default /opt/ai-gov)
#   - DEPLOY_DIR/.env already present, holding JWT_SECRET, MONGODB_URI,
#     ENCRYPTION_KEY, ENROLL_SECRET. This deploy NEVER ships or overwrites it —
#     no app or database secret is ever stored in GitHub.
#
# NOT BUILT HERE: the Claude Usage Tracker .exe and the NSIS installer. Node SEA
# builds only for the platform it runs on, so a Windows machine running
# `npm run deploy` is still the only way to produce a NEW tracker binary. The one
# already on the host survives every run of this workflow (see the stash below).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  # NOT cancel-in-progress. A deploy cancelled midway through the wipe-and-unpack
  # step below leaves DEPLOY_DIR half-populated and the site down. Queue instead.
  cancel-in-progress: false

permissions:
  # Read-only: nothing in this workflow pushes to git. Layer 1 (image
  # tag rollback) needs no git access at all; there is no Layer 2 anymore.
  contents: read

jobs:
  # ── Blocking: unit tests ──────────────────────────────────────────────────
  # Folded in from the old ci.yml verbatim. The deploy job below waits on this
  # (and `frontend`), so a red test run never reaches the server.
  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    # A HANGING TEST USED TO BLOCK EVERY DEPLOY. tests/worker-load.test.mjs imports
    # the service worker for real, and a top-level setInterval there kept the Node
    # process alive, so `node --test` never returned. With no timeout this job ran
    # to GitHub's 6-hour ceiling while `concurrency: deploy-server` held the lock —
    # and since only the most recent queued run survives, every push behind it was
    # cancelled. Six commits sat undeployed on one leaked timer.
    #
    # The suites take well under a minute each; 10 turns a future hang into a fast,
    # obvious failure instead of a silent six-hour deploy freeze.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # server's own `npm test` runs the suite under tsx. It has to: several
          # suites reach src/governance/**/*.ts through their import chain, and a
          # bare `node --test` throws ERR_UNKNOWN_FILE_EXTENSION on the first .ts
          # file it meets.
          - project: server
            cache: npm
            install: npm ci --no-audit --no-fund
            test: npm test
          # KNOWN FAILURES, deliberately skipped so this gate can block a broken
          # deploy without being permanently red. Each is a real open issue, not
          # a flake:
          #   "override safety" / "roleplay bypass"  guardrails.test.js — the
          #       injection-override-safety and roleplay patterns do not match
          #       the phrasings the test feeds them (a detection gap in a DLP
          #       product; fixing it is a product change, not a CI change).
          #   "GAP: a streamed call with no usage block …"  proxy-api-report —
          #       this test PINS the old behaviour (parsed === null). It fails
          #       because the behaviour it pinned has since changed, so the test
          #       is what needs updating, not the code.
          # Remove a name from this pattern the moment its issue is closed.
          - project: agent
            cache: npm
            install: npm ci --no-audit --no-fund
            test: >-
              node --test
              --test-skip-pattern='^(override safety|roleplay bypass|GAP: a streamed call with no usage block)'
              "tests/**/*.test.*"
          # No package-lock.json in sdk-js: `npm ci` would fail outright, and an
          # empty `cache` keeps setup-node from failing on the missing lockfile.
          - project: sdk-js
            cache: ''
            install: npm install --no-audit --no-fund
            test: npm test
          - project: browser-extension
            cache: npm
            install: npm ci --no-audit --no-fund
            test: npm test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ matrix.cache }}
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install ${{ matrix.project }} deps
        working-directory: ${{ matrix.project }}
        run: ${{ matrix.install }}

      - name: Test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        # The suites sign machine tokens at import time, so JWT_SECRET must be
        # set — any value works, it never leaves the runner.
        env:
          JWT_SECRET: ci-test-secret-not-used-anywhere
        run: ${{ matrix.test }}

  # ── Blocking: the bundle the deploy ships ─────────────────────────────────
  frontend:
    name: build connect-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connect-ui/package-lock.json

      - name: Install connect-ui deps
        working-directory: connect-ui
        run: npm ci --no-audit --no-fund

      - name: Build connect-ui
        working-directory: connect-ui
        # VITE_ADMIN_TOKEN is forced EMPTY on purpose. Vite inlines every
        # import.meta.env.VITE_* as a string literal, and dist/ is served
        # publicly at /CloudFuze — so a real admin token here would hand every
        # visitor a credential that unlocks session replays, SIEM export and
        # approvals.
        env:
          VITE_ADMIN_TOKEN: ''
          VITE_BUILD_SHA: ${{ github.sha }}
          # Hotjar Site ID. A repo *variable*, not a secret: it ships inside client-side JS
          # that every visitor can read, so hiding it buys nothing. Unset -> empty -> Hotjar
          # is fully off in the built bundle (no script requested, no session recorded).
          # Set it under Settings -> Secrets and variables -> Actions -> Variables.
          VITE_HOTJAR_SITE_ID: ${{ vars.HOTJAR_SITE_ID }}
        run: npm run build

      - name: Check the bundle carries no admin token
        run: |
          if grep -rlE 'Bearer [A-Fa-f0-9]{32,}' connect-ui/dist >/dev/null 2>&1; then
            echo "::error::a bearer-token-shaped literal is baked into connect-ui/dist"
            exit 1
          fi
          echo "clean"

      - uses: actions/upload-artifact@v4
        with:
          name: connect-ui-dist
          path: connect-ui/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [test, frontend]
    runs-on: [self-hosted, linux, ai-gov]
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/ai-gov' }}
      # Deployment topology — set as repository VARIABLES (not secrets; neither
      # is sensitive) under Settings -> Secrets and variables -> Actions ->
      # Variables. The defaults are the current production values.
      #   CONNECT_UI_PORT    3000 is already taken on this box, so the frontend
      #                      publishes 34441 and nginx serves it on 443.
      #   PUBLIC_SERVER_URL  the origin users and installers actually reach.
      #                      Without it the server bakes http://<host>:8787 into
      #                      every installer — a port that speaks plain HTTP.
      CONNECT_UI_PORT: ${{ vars.CONNECT_UI_PORT || '34441' }}
      PUBLIC_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL || 'https://agentgovernence.cftools.live' }}
    steps:
      - uses: actions/checkout@v4

      # Built by the `frontend` job above on a GitHub-hosted runner. It is not
      # rebuilt here because the Vite build OOMs on this box.
      - uses: actions/download-artifact@v4
        with:
          name: connect-ui-dist
          path: connect-ui/dist

      - name: Sanity-check the bundle arrived
        run: test -f connect-ui/dist/index.html || { echo "::error::no connect-ui/dist/index.html"; exit 1; }

      - name: Verify the server keeps its own .env
        run: |
          set -euo pipefail
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            echo "::error::No $DEPLOY_DIR/.env on this host. Create it ONCE by hand with"
            echo "::error::JWT_SECRET, MONGODB_URI, ENCRYPTION_KEY, ENROLL_SECRET (see .env.example)."
            echo "::error::The deploy never ships secrets."
            exit 1
          fi

      - name: Ensure ADMIN_TOKEN and ENROLL_SECRET exist (generated once, never overwritten)
        run: |
          set -euo pipefail
          # Same contract as scripts/deploy.mjs: generated server-side if absent,
          # never overwritten, never printed. ENROLL_SECRET especially — left
          # unset, auth.js falls back to 'dev-enroll-secret-change-me', a value
          # committed to this repository, and anyone who read the source could
          # enrol a machine into the fleet.
          grep -q '^ADMIN_TOKEN='   "$DEPLOY_DIR/.env" || echo "ADMIN_TOKEN=$(openssl rand -hex 32)"   >> "$DEPLOY_DIR/.env"
          grep -q '^ENROLL_SECRET=' "$DEPLOY_DIR/.env" || echo "ENROLL_SECRET=$(openssl rand -hex 32)" >> "$DEPLOY_DIR/.env"

      - name: Ship this checkout into the deploy dir
        run: |
          set -euo pipefail
          STASH="$DEPLOY_DIR/.prebuilt-stash"

          # The tracker .exe can only be produced by a Windows `npm run deploy`,
          # and this runner is Linux. Without stashing it, the first push to main
          # after a Windows deploy would wipe the binary and the download would
          # 501 with nothing in the log to say why. An incoming build always
          # wins; the stash only fills a gap.
          rm -rf "$STASH"
          if [ -d "$DEPLOY_DIR/agent/prebuilt" ]; then
            mv "$DEPLOY_DIR/agent/prebuilt" "$STASH"
          fi

          # Remove stale files so a source file deleted in git really disappears
          # from the host. .env and the stash are the only survivors.
          find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 \
            ! -name .env ! -name .prebuilt-stash -exec rm -rf {} +

          # The same file set scripts/deploy.mjs ships. connect-ui/dist is NOT
          # excluded — that is the bundle downloaded above.
          tar cf - \
            --exclude='*/node_modules' --exclude='*/.vite' \
            --exclude='*/coverage' --exclude='*/build' --exclude='*/out' \
            agent server connect-ui browser-extension scripts sdk-js \
            docker-compose.yml .dockerignore \
            | tar xf - -C "$DEPLOY_DIR"

          if [ -d "$STASH" ] && [ ! -d "$DEPLOY_DIR/agent/prebuilt" ]; then
            mkdir -p "$DEPLOY_DIR/agent"
            mv "$STASH" "$DEPLOY_DIR/agent/prebuilt"
          fi
          rm -rf "$STASH"

      - name: Back up the database before deploying
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Only if mongo is already up — a first-ever deploy has nothing to back
          # up yet. mongo:7 here runs with no auth configured (docker-compose.yml
          # sets no MONGO_INITDB_ROOT_USERNAME), so no credentials to guess or
          # template — this really is the exact command that runs.
          if ! docker compose ps --status running -q mongo | grep -q .; then
            echo "mongo not running yet (first deploy) — nothing to back up"
            exit 0
          fi
          mkdir -p "$DEPLOY_DIR/backups"
          BACKUP_FILE="$DEPLOY_DIR/backups/pre-deploy-${GITHUB_SHA}.archive.gz"
          docker compose exec -T mongo mongodump --archive --gzip --db=aigov > "$BACKUP_FILE"
          SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo 0)
          # A cutoff of 100 bytes only catches a dump that produced nothing at
          # all (empty archive header) or failed silently — not a judgement
          # about how much data SHOULD be there.
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::pre-deploy backup is suspiciously small ($SIZE bytes) at $BACKUP_FILE — refusing to deploy without a real backup"
            exit 1
          fi
          echo "pre-deploy backup OK: $BACKUP_FILE ($SIZE bytes)"

      - name: Snapshot the currently running images as ":previous"
        run: |
          set -euo pipefail
          # Must run BEFORE the build step below — `docker compose build` moves
          # the ":latest" tag onto the new image immediately, so ":previous" has
          # to be pinned to the OLD image before that happens or there is
          # nothing left to restore from on a failed health check. `|| true`
          # covers the first-ever deploy, where ":latest" doesn't exist yet.
          docker tag cloudfuze/ai-gov-server:latest cloudfuze/ai-gov-server:previous || true
          docker tag cloudfuze/ai-gov-connect-ui:latest cloudfuze/ai-gov-connect-ui:previous || true

      - name: Build new images (does not touch the running stack)
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Sequential, not one `compose build` — this is a small (~1 GB) box and
          # building both images at once has run it out of memory.
          #
          # A failure here stops before the "Swap" step below ever runs, so the
          # currently running containers — still on the ":previous" image tagged
          # above — are never touched. Nothing to restore; the job just fails.
          docker compose build server
          docker compose build connect-ui

      - name: Record failure stage (build)
        if: failure()
        run: echo "DEPLOY_FAILURE_STAGE=build" >> "$GITHUB_ENV"

      - name: Swap to the new images
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose up -d
          docker compose ps

      - name: Health check over the address users actually reach
        run: |
          set -euo pipefail
          # Checking the PROXIED origin is the point: it exercises nginx, TLS and
          # the route into the container, so a stack that is up but unreachable —
          # the only failure a user would notice — fails the deploy.
          URL="${PUBLIC_SERVER_URL%/}/api/v1/health"
          for i in $(seq 1 20); do
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after attempt $i: $URL"
              exit 0
            fi
            echo "attempt $i: HTTP ${code:-none}"
            sleep 3
          done
          echo "::error::server did not pass the health check at $URL"
          (cd "$DEPLOY_DIR" && docker compose logs --tail 60 server) || true
          exit 1

      - name: Layer 1 — restart the previous version (health check failed)
        if: failure() && env.DEPLOY_FAILURE_STAGE != 'build'
        run: |
          set -euo pipefail
          echo "DEPLOY_FAILURE_STAGE=healthcheck" >> "$GITHUB_ENV"
          cd "$DEPLOY_DIR"
          # Point ":latest" back at the image that was running before this
          # deploy, then `up -d` recreates the containers from it. This never
          # touches git — it's the seconds-scale layer. `|| true` covers the
          # (should-be-impossible-here) case where no ":previous" tag exists.
          docker tag cloudfuze/ai-gov-server:previous cloudfuze/ai-gov-server:latest || true
          docker tag cloudfuze/ai-gov-connect-ui:previous cloudfuze/ai-gov-connect-ui:latest || true
          docker compose up -d
          docker compose ps
          echo "::error::health check failed — production was rolled back to the last known-good container image. main is left untouched; a human needs to push a fix."

      - name: Summary
        run: |
          {
            echo "### Deployed ${GITHUB_SHA:0:7} to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| API | ${PUBLIC_SERVER_URL%/}/api/v1/health |"
            echo "| connect-ui | ${PUBLIC_SERVER_URL%/}/CloudFuze/ |"
            echo "| frontend port on host | ${CONNECT_UI_PORT} |"
            echo
            echo "The Claude Usage Tracker .exe was **not** rebuilt (Linux runner);"
            echo "the binary already on the host was preserved."
          } >> "$GITHUB_STEP_SUMMARY"
