name: CI

# The HARD GATE: unit tests and the production frontend build. Every job here is
# blocking — if it is in this file, it can stop a deploy. Checks worth seeing but
# not worth blocking on (lint, the known-failing tests) live in advisory.yml
# precisely so they can never reach this file's conclusion.
#
# Runs on every push to a non-main branch and every PR. On main it is NOT
# triggered directly — deploy.yml calls it via `workflow_call` so a push to main
# gets exactly one CI run, and the deploy waits on it.
#
# It also PRODUCES the artifact the deploy consumes: connect-ui/dist. The Vite
# build lives here rather than on the server because it needs more RAM than the
# ~1 GB deploy host has (see the header of scripts/deploy.mjs).

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  # ── Blocking: unit tests ──────────────────────────────────────────────────
  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # server's own `npm test` runs the suite under tsx. It has to: several
          # suites reach src/governance/**/*.ts through their import chain, and a
          # bare `node --test` throws ERR_UNKNOWN_FILE_EXTENSION on the first .ts
          # file it meets. That was hiding real coverage, not just one red test —
          # 152 tests ran before the loader was added, 215 after. tsx is the same
          # loader the server starts under in production.
          - project: server
            cache: npm
            install: npm ci --no-audit --no-fund
            test: npm test
          # KNOWN FAILURES, deliberately skipped so this gate can block a broken
          # deploy without being permanently red. Each is a real open issue, not
          # a flake, and the `known-failing tests` job in advisory.yml still runs
          # them so they stay visible in every run:
          #   "override safety" / "roleplay bypass"  guardrails.test.js — the
          #       injection-override-safety and roleplay patterns do not match
          #       the phrasings the test feeds them (a detection gap in a DLP
          #       product; fixing it is a product change, not a CI change).
          #   "GAP: a streamed call with no usage block …"  proxy-api-report —
          #       this test PINS the old behaviour (parsed === null). It fails
          #       because the behaviour it pinned has since changed, so the test
          #       is what needs updating, not the code.
          # Remove a name from this pattern the moment its issue is closed.
          - project: agent
            cache: npm
            install: npm ci --no-audit --no-fund
            test: >-
              node --test
              --test-skip-pattern='^(override safety|roleplay bypass|GAP: a streamed call with no usage block)'
              "tests/**/*.test.*"
          # No package-lock.json in sdk-js: `npm ci` would fail outright, and an
          # empty `cache` keeps setup-node from failing on the missing lockfile.
          - project: sdk-js
            cache: ''
            install: npm install --no-audit --no-fund
            test: npm test
          - project: browser-extension
            cache: npm
            install: npm ci --no-audit --no-fund
            test: npm test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Per-project, because sdk-js has no package-lock.json: with
          # `cache: npm` setup-node resolves cache-dependency-path and FAILS the
          # step outright when the glob matches nothing ("Some specified paths
          # were not resolved"), which is what broke this job on 73f3739 and
          # 1c29d75 and took the whole deploy down with it. Empty disables the
          # cache for that one project.
          cache: ${{ matrix.cache }}
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install ${{ matrix.project }} deps
        working-directory: ${{ matrix.project }}
        run: ${{ matrix.install }}

      - name: Test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        # The suites sign machine tokens at import time, so JWT_SECRET must be
        # set — any value works, it never leaves the runner. The real secret
        # lives only in the server's own .env on the host.
        env:
          JWT_SECRET: ci-test-secret-not-used-anywhere
        run: ${{ matrix.test }}

  # ── Blocking: the bundle the deploy ships ─────────────────────────────────
  frontend:
    name: build connect-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connect-ui/package-lock.json

      - name: Install connect-ui deps
        working-directory: connect-ui
        run: npm ci --no-audit --no-fund

      - name: Build connect-ui
        working-directory: connect-ui
        # VITE_ADMIN_TOKEN is forced EMPTY on purpose. Vite inlines every
        # import.meta.env.VITE_* as a string literal, and dist/ is served
        # publicly at /CloudFuze — so a real admin token here would hand every
        # visitor a credential that unlocks session replays, SIEM export and
        # approvals. scripts/deploy.mjs does the same, for the same reason.
        env:
          VITE_ADMIN_TOKEN: ''
          # Rendered as the "build <sha>" stamp at the bottom of every AI Hub
          # page, so which commit is live is visible in the UI. A SHA is safe to
          # expose the way a token is not — it identifies a build, it does not
          # authorise anything.
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Check the bundle carries no admin token
        # Cheap guard against a regression re-introducing the leak above.
        run: |
          if grep -rlE 'Bearer [A-Fa-f0-9]{32,}' connect-ui/dist >/dev/null 2>&1; then
            echo "::error::a bearer-token-shaped literal is baked into connect-ui/dist"
            exit 1
          fi
          echo "clean"

      - uses: actions/upload-artifact@v4
        with:
          name: connect-ui-dist
          path: connect-ui/dist
          retention-days: 7
          if-no-files-found: error
