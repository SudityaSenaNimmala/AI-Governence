# AI-Governance app stack — backend API + connect-ui frontend + mongo.
#
# Brought up two ways, both of which run compose ON the deploy host:
#   - automatically, by .github/workflows/deploy.yml on every push to `main`
#     (see docs/AUTO_DEPLOY.md)
#   - manually, by `npm run deploy` (scripts/deploy.mjs) over SSH
#
# Neither uses DOCKER_HOST. scripts/deploy.mjs targets the host via DEPLOY_SSH and
# runs compose there natively — buildx-over-SSH drops the connection on this box,
# and the Vite build OOMs on it, which is why the frontend is built elsewhere and
# shipped as a prebuilt dist/.
#
#   docker compose up -d --build        # on the host, for a hand-run
#
# Secrets live in the host's own .env next to this file (see .env.example). No
# deploy path ever ships or overwrites it.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: cloudfuze/ai-gov-server:latest
    environment:
      NODE_ENV: production
      PORT: 8787
      # REQUIRED — deploy fails fast if unset.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # The server's DAL is MongoDB-only. Defaults to the bundled mongo service;
      # override in .env to point at an external Mongo (e.g. Atlas).
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/aigov}
      # Gates the admin-only dashboard routes (Session Replay playback, etc.).
      # scripts/deploy.mjs auto-generates this in the server's .env on first
      # deploy if it's missing, and never overwrites an existing value. Without
      # this line the container never sees it and silently falls back to the
      # hardcoded dev default, regardless of what's in .env.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Gates POST /api/v1/enroll — the credential every browser extension and
      # tracker binary presents to join the fleet.
      #
      # Without this line the container never sees what is in the server's .env and
      # auth.js falls back to 'dev-enroll-secret-change-me', a value committed to
      # this repository. Two consequences, both live in production today: anyone who
      # reads the repo can enrol a machine and post events to it, and the two
      # installers disagree — the extension zip bakes the secret the SERVER holds
      # (so it works) while the tracker .exe bakes the one in the server's .env (so
      # it 401s on enrolment and silently reports nothing) the moment those differ.
      # Passing it here makes the server's own .env the single source for all three.
      ENROLL_SECRET: ${ENROLL_SECRET:-}
      # The address baked into downloaded installers. Set this whenever the stack
      # sits behind a reverse proxy or TLS terminator, because the request-derived
      # fallback appends the API's own port and produces https://<domain>:8787 —
      # a port that speaks plain HTTP, so nothing can connect to it.
      # e.g. PUBLIC_SERVER_URL=https://agentgovernence.cftools.live
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-}
      # Signs the force-installable browser-extension package the server builds
      # and serves at /api/v1/extension/*. The extension ID is DERIVED from this
      # key, and the force-install policy on every managed machine names that ID —
      # so this value is not rotatable: change it and every deployed policy points
      # at an extension that no longer exists.
      #
      # Store it base64-encoded on ONE line. A PEM's newlines do not survive
      # .env/compose substitution intact, and a silently truncated key produces a
      # package that installs nowhere with no error shown. The server accepts
      # either form and only treats a value as a key if it decodes to a PEM.
      #
      # Without this line the container never sees what is in the host's .env and
      # /api/v1/extension/* answers 503 forever while every machine's policy
      # points at it — the same class of bug as ENROLL_SECRET above.
      CRX_SIGNING_KEY: ${CRX_SIGNING_KEY:-}
      # TEMPORARY: makes the admin-gated dashboard panels (Access Requests, Active
      # Exceptions, session replay, SDK projects) work before admin OAuth ships.
      # The dashboard has no way for a person to sign in yet, so those panels are
      # otherwise unusable — the browser has no credential and the server correctly
      # answers 401.
      #
      # WITH THIS ON, ANYONE WHO CAN REACH THE API CAN APPROVE OR REVOKE TOOL
      # ACCESS. Only defensible while the host is reachable from inside the network
      # or by people who would be admins anyway. Defaults off; the server logs a
      # warning and /api/v1/health reports admin_auth:"open" so it is discoverable
      # without reading this file. Remove when OAuth lands.
      ADMIN_AUTH_OPEN: ${ADMIN_AUTH_OPEN:-}
      # Developer SDK → Langfuse Cloud gateway (server/src/routes/langfuse-gateway.js).
      # These are CloudFuze's ONE real Langfuse project credential; they are
      # issued by Langfuse to a human and pasted into .env, never generated by
      # this repo's code (unlike ADMIN_TOKEN).
      #
      # Deliberately NOT `${VAR:?...}` fail-fast like JWT_SECRET. JWT_SECRET is
      # load-bearing for the whole server — without it nothing authenticates — so
      # refusing to boot is right. These three gate ONE feature, and while they
      # are being obtained out of band a hard failure here would block every
      # unrelated deploy of DLP, replay and discovery. Instead the gateway
      # answers 503 "Langfuse not configured" and the dashboard read path returns
      # a `degraded: true` empty result, both with a loud server-side warning —
      # a missing credential is visible, never silent, and never a 500.
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Interactive OAuth sign-in for Microsoft and Google (server/src/governance/
      # routes/{msOAuth,googleOAuth}.ts). CloudFuze registers ONE multi-tenant Entra
      # app and ONE Google OAuth client; each customer's admin clicks Connect and
      # consents. They never see a client id or secret.
      #
      # Without these lines the container never sees what is in the host's .env, so
      # msOAuthConfigured()/googleOAuthConfigured() return false, /api/auth/*/status
      # answers {"configured":false} and the UI hides the sign-in buttons and falls
      # back to the old form — the credentials look correct on the host and the
      # feature is invisible anyway. Same class as ENROLL_SECRET and CRX_SIGNING_KEY
      # above; it is how this shipped dark on the live host.
      #
      # Not `${VAR:?...}` fail-fast: these gate discovery onboarding, not the whole
      # server, and /start already answers 503 with a remedy string while they are
      # being obtained out of band.
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Where the browser lands after consent. The code default is localhost:3000,
      # which on a deployed host sends the admin to their own machine and looks like
      # the flow failed at the last step. Must be the public dashboard URL.
      UI_RETURN_URL: ${UI_RETURN_URL:-}
    depends_on:
      - mongo
    ports:
      - "8787:8787"
    volumes:
      - server-data:/app/server/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    # Cap the WiredTiger cache — this is a small (~1 GB) host.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  connect-ui:
    build:
      context: ./connect-ui
      dockerfile: Dockerfile
    image: cloudfuze/ai-gov-connect-ui:latest
    ports:
      # Host port -> nginx 80. App is live at http://<host>:<port>/CloudFuze
      #
      # Parameterised because 3000 is not always free: on the cftools.live host it
      # was already taken by another app, so this publishes 34441 there and an
      # nginx in front serves https://agentgovernence.cftools.live/CloudFuze/. Left
      # hardcoded, a deploy would try to bind a port another process owns and the
      # container would fail to start — taking the site down rather than failing
      # visibly at build time.
      - "${CONNECT_UI_PORT:-3000}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
  mongo-data:
